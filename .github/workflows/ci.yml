name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Версия обязана совпадать с requirements-dev.txt и с локально
      # установленной: свежий ruff (0.16.x) включил новые правила по умолчанию
      # и давал ~1477 ошибок на коде, который проходит 0.15.15.
      - name: Install dependencies
        run: |
          pip install ruff==0.15.15

      # Команда как у разработчика локально: `ruff check .` со всеми правилами
      # из ruff.toml. Явный список каталогов пришлось убрать — bridge_bot/ и
      # vk_bot/ не отслеживаются git (локальные только), на CI их нет и ruff
      # падал с E902 No such file or directory.
      - name: Run ruff
        run: |
          ruff check .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          # аудио-стек модуля «Музыка»: без него core.music не импортируется
          # (numpy/librosa/soundfile) и падают test_music/test_freemium_gates
          pip install -r requirements-audio.txt
          # бинарник sing-box нужен тестам сборки конфига (runner.build)
          python -m scripts.lthub_tunnel.tunnel install

      - name: Run unit tests
        run: |
          pytest tests/unit/ -q --tb=short

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run integration tests
        run: |
          pytest tests/integration/ -q --tb=short

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -r requirements-audio.txt
          python -m scripts.lthub_tunnel.tunnel install

      - name: Run tests with coverage
        run: |
          pytest tests/unit/ --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
